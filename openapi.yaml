openapi: 3.1.0
info:
  title: IncuBrix AI Background Music Engine
  description: Original, commercially safe instrumental background music for video
    with genuine isolated instrument stems.
  version: 1.0.0
paths:
  /api/v1/music/jobs:
    post:
      summary: Submit background music generation job
      description: Asynchronously queues an instrumental background music generation
        job.
      operationId: create_music_job_api_v1_music_jobs_post
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional override provider ('mock' or 'synth')
          title: Provider
        description: Optional override provider ('mock' or 'synth')
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Get music generation job status
      description: Polls current status, progress percentage (0-100), and result links.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/music/jobs/{job_id}/regenerate-stem:
    post:
      summary: Regenerate single instrument stem
      description: Regenerates only the specified stem (e.g. 'drums') without altering
        any other stems.
      operationId: regenerate_stem_api_v1_music_jobs__job_id__regenerate_stem_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StemRegenerateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/upload:
    post:
      summary: Upload voiceover / narration audio
      description: Uploads narration audio to pass into music generation job.
      operationId: upload_audio_api_v1_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_api_v1_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/artifacts/{job_id}/{file_path}:
    get:
      summary: Download generated audio artifacts and manifest
      description: Serves mix.wav, mix.mp3, stems/*.wav, mix_ducked.wav, and music_manifest.json.
      operationId: get_artifact_api_v1_artifacts__job_id___file_path__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: file_path
        in: path
        required: true
        schema:
          type: string
          title: File Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - System
      summary: Liveness check
      description: Standard liveness probe endpoint returning 200 OK.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - System
      summary: Readiness check
      description: Standard readiness probe checking storage, audio engine, and provider
        readiness.
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - System
      summary: Root status
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_upload_audio_api_v1_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_audio_api_v1_upload_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobCreatedResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
          default: queued
        progress:
          type: integer
          title: Progress
          default: 0
        message:
          type: string
          title: Message
          default: Job accepted and queued for generation
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - job_id
      - created_at
      title: JobCreatedResponse
    JobResultFiles:
      properties:
        mix_url:
          type: string
          title: Mix Url
          description: Download link for mix.wav
        mix_mp3_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Mix Mp3 Url
          description: Download link for mix.mp3
        mix_ducked_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Mix Ducked Url
          description: Download link for mix_ducked.wav if narration provided
        stems:
          additionalProperties:
            type: string
          type: object
          title: Stems
          description: Download links for each individual stem.wav
        manifest_url:
          type: string
          title: Manifest Url
          description: Download link for music_manifest.json
      type: object
      required:
      - mix_url
      - stems
      - manifest_url
      title: JobResultFiles
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
          description: queued, running, succeeded, failed
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
          description: Job progress percentage 0-100
          default: 0
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResultFiles'
          - type: 'null'
        manifest:
          anyOf:
          - $ref: '#/components/schemas/MusicManifest'
          - type: 'null'
        error:
          anyOf:
          - type: object
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      - created_at
      - updated_at
      title: JobStatusResponse
    MusicJobRequest:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
          description: Style and mood prompt description
        duration_s:
          type: number
          maximum: 300.0
          minimum: 5.0
          title: Duration S
          description: Requested duration in seconds (5 to 300s)
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/Section'
            type: array
          - type: 'null'
          title: Sections
          description: Optional cut points and mood transitions
        tempo_bpm:
          anyOf:
          - type: number
            maximum: 240.0
            minimum: 40.0
          - type: 'null'
          title: Tempo Bpm
          description: Optional fixed tempo in BPM
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Optional musical key (e.g. 'C major', 'A minor')
        loopable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Loopable
          description: Whether the track must loop seamlessly
          default: false
        narration_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Narration Url
          description: URL or local path to voiceover audio to duck music
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Webhook URL called when job finishes
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Deterministic random seed
        output:
          anyOf:
          - $ref: '#/components/schemas/OutputConfig'
          - type: 'null'
          description: Output rendering options
      type: object
      required:
      - prompt
      - duration_s
      title: MusicJobRequest
    MusicManifest:
      properties:
        job_id:
          type: string
          title: Job Id
        prompt:
          type: string
          title: Prompt
        duration_s:
          type: number
          title: Duration S
        actual_duration_s:
          type: number
          title: Actual Duration S
        tempo_bpm:
          type: number
          title: Tempo Bpm
        key:
          type: string
          title: Key
        seed:
          type: integer
          title: Seed
        loopable:
          type: boolean
          title: Loopable
        sections:
          items:
            type: object
          type: array
          title: Sections
        beat_times_s:
          items:
            type: number
          type: array
          title: Beat Times S
        bar_times_s:
          items:
            type: number
          type: array
          title: Bar Times S
        stem_gains:
          additionalProperties:
            type: number
          type: object
          title: Stem Gains
        stems_metadata:
          additionalProperties:
            type: object
          type: object
          title: Stems Metadata
        loudness:
          type: object
          title: Loudness
        ducking_applied:
          type: boolean
          title: Ducking Applied
        volume_curve:
          anyOf:
          - items:
              additionalProperties:
                type: number
              type: object
            type: array
          - type: 'null'
          title: Volume Curve
        models_providers:
          type: object
          title: Models Providers
        timings:
          additionalProperties:
            type: number
          type: object
          title: Timings
        cost_estimate:
          type: object
          title: Cost Estimate
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        licence_rights:
          type: object
          title: Licence Rights
      type: object
      required:
      - job_id
      - prompt
      - duration_s
      - actual_duration_s
      - tempo_bpm
      - key
      - seed
      - loopable
      - sections
      - beat_times_s
      - bar_times_s
      - stem_gains
      - stems_metadata
      - loudness
      - ducking_applied
      - models_providers
      - timings
      - cost_estimate
      - warnings
      - licence_rights
      title: MusicManifest
    OutputConfig:
      properties:
        sample_rate:
          type: integer
          title: Sample Rate
          description: Audio sample rate (Hz), standard 48000
          default: 48000
        target_lufs:
          type: number
          title: Target Lufs
          description: Target integrated loudness in LUFS (standard -16 LUFS)
          default: -16.0
        formats:
          items:
            type: string
          type: array
          title: Formats
          description: Formats to export
      type: object
      title: OutputConfig
    Section:
      properties:
        start_s:
          type: number
          minimum: 0.0
          title: Start S
          description: Start time of the section in seconds
        mood:
          type: string
          minLength: 1
          title: Mood
          description: Mood or intensity description for this section
      type: object
      required:
      - start_s
      - mood
      title: Section
    StemRegenerateRequest:
      properties:
        stem_name:
          type: string
          title: Stem Name
          description: Name of the stem to regenerate (e.g. 'drums', 'melody', 'bass',
            'chords')
        prompt_modifier:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Modifier
          description: Optional specific prompt modifier for this stem
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: New seed for this stem
      type: object
      required:
      - stem_name
      title: StemRegenerateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
