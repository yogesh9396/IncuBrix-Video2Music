version: "3.8"

services:
  incubrix-music-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-music-engine
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - MUSIC_PROVIDER=synth
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=/app/storage_data
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=incubrix-audio
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - WEBHOOK_SECRET=incubrix_secret_key_demo
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: incubrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  storage_data:
  minio_data:
